<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "default" gives an opaque, iOS-drawn status bar with dark icons,
         which iOS reserves space for itself (content doesn't render
         underneath). Needed because our header is now light-colored —
         the only translucent/overlay option ("black-translucent") always
         renders light-colored system icons, which would go unreadable
         against a light header. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- iOS reads this for the home-screen icon label instead of the
         manifest — without it, "Add to Home Screen" falls back to
         whatever <title> says, so this has to be kept in sync with the
         manifest's name/short_name separately. -->
    <meta name="apple-mobile-web-app-title" content="CM Circle" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>CM Circle</title>
  </head>
  <body>
    <!-- Never leave #root truly empty at first paint — on iOS standalone
         launches specifically (no browser chrome providing a stable
         layout reference, unlike a Safari tab), a genuinely blank paint
         while JS loads/the auth check resolves can cause the WebView to
         compute the wrong initial zoom scale, only fixable by a manual
         pinch. This placeholder is replaced the instant React mounts. -->
    <div id="root">
      <div style="height: 100%; width: 100%; background: #ffffff;"></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
